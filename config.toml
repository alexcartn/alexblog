baseURL = "https://alexandrecarton.netlify.app/"
title = "Alexandre CARTON"
author = "Alex Carton"
paginate = 5
theme = "apero"
copyright = "© 2025 Alexandre Carton, France"


[params]
  orgName = "Alexandre Carton, France"
  # orgLocal = "France"
  description = "Blog technique et coaching par Alexandre Carton, ingénieur chef de projet. Découvrez des articles sur le CrossFit, la data science, le management et l'innovation industrielle."
  favicon = "/img/logosite.png"  # Placez votre favicon dans static/img/
  logo = "/img/logosite.png"        # Placez votre logo dans static/img/
  sharing_image = "/img/logosite.png"  # Image pour les partages sociaux
  twitter = "votre_twitter"  # Nom d'utilisateur Twitter sans @
  navallcaps = true  # Navigation en majuscules

  # Polices
  # use an embedded font-family
  # serif options: Fraunces / EB Garamond / Bitter
  # sans-serif options: Commissioner / Atkinson Hyperlegible / Metropolis
  
  textFontFamily = "Atkinson Hyperlegible"
  headingFontFamily = "EB Garamond"
  customtextFontFamily = ""
  customheadingFontFamily = ""

  # Thème de couleur
  theme = "forest"  # forest, grayscale, peach, plum, poppy, sky, violet, water

  # Icônes sociales
  socialInHeader = true
  socialInFooter = true

  [[params.social]]
    icon = "linkedin"
    icon_pack = "fab"
    url = "https://www.linkedin.com/in/alexandre-carton-741146175/"

mainSections = ["about", "blog", "project", "contact"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[menu]
  [[menu.header]]
    name = "Blog"
    title = "Mes articles de blog"
    url = "/blog/"
    weight = 2
  
  [[menu.header]]
    name = "Projets"
    title = "Mes projets"
    url = "/project/"
    weight = 3
  
  [[menu.header]]
    name = "Coaching"
    title = "Coaching"
    url = "/coaching/"
    weight = 5 

  [[menu.header]]
    name = "Contact"
    title = "Contact"
    url = "/contact/"
    weight = 5 
  
  [[menu.header]]
    name = "À propos"
    title = "À propos"
    url = "/about/"
    weight = 1



  [[menu.footer]]
    name = "Mentions Légales"
    title = "Mentions Légales"
    url = "/legal/"
    weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# SEO Configuration
enableRobotsTXT = true
canonifyURLs = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Language and localization
languageCode = "fr-FR"
defaultContentLanguage = "fr"

# Index de recherche (Ctrl K), publié en /search-index.json
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
